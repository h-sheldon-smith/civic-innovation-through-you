{% extends 'sidebar.html' %}
{% load avatar_tags %}

{% block city_sidebar_content %}
  <h3 class="sidebar-title">About Me</h3><br>
    {% if user.is_authenticated %}

    <h3 class="sidebar-user">
      <span class="user-sidebar-icon-img">
        <a href="{% url 'avatar:change' %}">
          {% avatar user class="user-sidebar-icon-img" %}
        </a>
      </span>

      <span class="username">{{ user.username }}</span>
    </h3>

    <span class="sidebar-user"><a href="{% url 'avatar:change' %}" target="_blank" rel="noopener noreferrer">Change your avatar</a></span>

    {% endif %}

{% endblock %}
