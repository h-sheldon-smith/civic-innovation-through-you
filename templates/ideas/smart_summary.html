
{% load static %}

<!-- Smart Summary Header -->
<div class="modal-header">
    <h2 class="title">Unread Inbox Summary</h2>
    <button data-close-x-button class="close-x-button">&times;</button>
</div>

<!-- Smart Summary Body -->
<div class="modal-body" data-dynamic="summary">
    <div id="output"></div>

</div>
    
<!-- Smart Summary Footer -->
<div class="modal-footer">
    <button data-close-button class="nav-btn" id="close-summary-modal" aria-label="Close">Close</button>
</div>
