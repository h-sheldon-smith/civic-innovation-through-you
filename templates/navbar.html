{% load static %}

<nav class="navbar">
  <div class="navbar-title">Civic Innovation Through You - Bellevue</div>

  <div class="navbar-links">
    {% url 'index' as index_url %}    
    <a href="{% url 'index' %}"
      class="nav-btn {% if request.path == index_url %}active{% endif %}">
      <img class="nav-icon-img" src="{% static 'icons/homeIcon.svg' %}" alt="" aria-hidden="true">
      Home
    </a>

    <button type="button" class="nav-btn" id="open-modal">
      <img class="nav-icon-img" src="{% static 'icons/ideaIcon.svg' %}" alt="" aria-hidden="true">
      Submit Idea
    </button>

    {% url 'about' as about_url %}    
    <a href="{% url 'about' %}"
      class="nav-btn {% if request.path == about_url %}active{% endif %}">
      <img class="nav-icon-img" src="{% static 'icons/discussionIcon.svg' %}" alt="" aria-hidden="true">
      Discussions
    </a>

    {% url 'contact' as contact_url %}    
    <a href="{% url 'contact' %}"
      class="nav-btn {% if request.path == contact_url %}active{% endif %}">
      <img class="nav-icon-img" src="{% static 'icons/logoutIcon.svg' %}" alt="" aria-hidden="true">
      Logout
    </a>
  </div>
</nav>

<!-- Idea Submission Popup -->
<div class="modal-backdrop" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-body">
        {% include "ideas/ideas_resident.html" %}
    </div>
    <div class="modal-footer">
    </div>
  </div>
</div>
